[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgetools-mcp-specnative"
version = "0.1.0"
description = "Domain MCP server for SpecNative workflows"
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
forge-mcp-specnative = "forgetools.mcp_specnative_server:main"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
