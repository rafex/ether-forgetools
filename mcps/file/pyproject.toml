[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgetools-mcp-file"
version = "0.1.0"
description = "Domain MCP server for file/content operations"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["Pillow>=10.0"]

[project.scripts]
forge-mcp-file = "forgetools.mcp_file_server:main"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
