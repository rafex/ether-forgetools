[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgetools-mcp-containers"
version = "0.1.0"
description = "Domain MCP server for containers and orchestration"
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
forge-mcp-containers = "forgetools.mcp_containers_server:main"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
