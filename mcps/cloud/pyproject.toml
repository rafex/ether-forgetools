[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgetools-mcp-cloud"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["forgetools"]

[project.scripts]
forge-mcp-cloud = "forgetools.mcp_cloud_server:main"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
