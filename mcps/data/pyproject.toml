[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgetools-mcp-data"
version = "0.1.0"
description = "Domain MCP server for database inspection and migrations"
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
forge-mcp-data = "forgetools.mcp_data_server:main"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
