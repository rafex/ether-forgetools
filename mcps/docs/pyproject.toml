[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgetools-mcp-docs"
version = "0.1.0"
description = "Domain MCP server for docs and web extraction"
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
forge-mcp-docs = "forgetools.mcp_docs_server:main"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
