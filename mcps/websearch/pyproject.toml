[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgetools-mcp-websearch"
version = "0.1.0"
description = "Domain MCP server for web search and navigation"
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["forgetools", "ddgs>=9.0.0"]

[project.scripts]
forge-mcp-websearch = "forgetools.mcp_websearch_server:main"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
