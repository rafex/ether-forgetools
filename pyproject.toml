[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgetools"
version = "0.1.0"
description = "Python toolkit of structured scripts for code agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
forge     = "forgetools._forge_cli:main"

[project.optional-dependencies]
mcp = ["fastmcp>=3.2.3"]
dev = ["pytest", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["forgetools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
